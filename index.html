<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>اختبار الفرق بين التاء المربوطة والهاء</title>
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --ink:#172033;
      --muted:#64748b;
      --primary:#2563eb;
      --primary-dark:#1e40af;
      --ok:#16a34a;
      --bad:#dc2626;
      --border:#e5e7eb;
      --soft:#eff6ff;
      --warning:#f59e0b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #dbeafe 0, transparent 28%),
        radial-gradient(circle at bottom right, #fef3c7 0, transparent 24%),
        var(--bg);
      color:var(--ink);
      min-height:100vh;
      line-height:1.75;
    }
    .wrap{
      width:min(980px, 94vw);
      margin:0 auto;
      padding:28px 0 48px;
    }
    header{
      background:linear-gradient(135deg, #1e3a8a, #2563eb);
      color:#fff;
      border-radius:28px;
      padding:28px;
      box-shadow:0 18px 45px rgba(30,58,138,.25);
      position:relative;
      overflow:hidden;
    }
    header:before{
      content:"";
      position:absolute;
      inset:auto -50px -90px auto;
      width:260px;
      height:260px;
      border-radius:50%;
      background:rgba(255,255,255,.12);
    }
    h1{
      margin:0 0 10px;
      font-size:clamp(24px, 4vw, 38px);
      letter-spacing:-.5px;
    }
    .subtitle{
      margin:0;
      color:#dbeafe;
      font-size:17px;
      max-width:760px;
    }
    .meta{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin:18px 0 0;
    }
    .field{
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.18);
      border-radius:16px;
      padding:12px 14px;
    }
    .field label{
      display:block;
      color:#dbeafe;
      font-size:13px;
      margin-bottom:4px;
    }
    .field input{
      width:100%;
      border:0;
      outline:0;
      background:transparent;
      color:#fff;
      font-size:16px;
      font-weight:700;
    }
    .field input::placeholder{color:rgba(255,255,255,.7)}
    .panel{
      margin-top:22px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:24px;
      padding:22px;
      box-shadow:0 14px 35px rgba(15,23,42,.08);
    }
    .topbar{
      display:flex;
      gap:14px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      margin-bottom:16px;
    }
    .progress-wrap{
      flex:1 1 260px;
    }
    .progress-label{
      display:flex;
      justify-content:space-between;
      font-size:14px;
      color:var(--muted);
      margin-bottom:7px;
    }
    .progress{
      height:12px;
      border-radius:999px;
      background:#e2e8f0;
      overflow:hidden;
    }
    .bar{
      height:100%;
      width:0%;
      background:linear-gradient(90deg, var(--primary), #60a5fa);
      transition:.25s ease;
    }
    .score-pill{
      background:var(--soft);
      color:var(--primary-dark);
      border:1px solid #bfdbfe;
      padding:10px 14px;
      border-radius:999px;
      font-weight:800;
      white-space:nowrap;
    }
    .question-card{
      border:1px solid var(--border);
      border-radius:22px;
      padding:22px;
      background:#fff;
    }
    .q-num{
      color:var(--primary);
      font-weight:900;
      margin-bottom:8px;
      font-size:15px;
    }
    .q-text{
      font-size:22px;
      font-weight:900;
      margin:0 0 18px;
      letter-spacing:-.2px;
    }
    .choices{
      display:grid;
      gap:12px;
    }
    .choice{
      display:flex;
      align-items:flex-start;
      gap:12px;
      width:100%;
      border:1px solid var(--border);
      background:#fff;
      color:var(--ink);
      padding:14px 16px;
      border-radius:16px;
      cursor:pointer;
      text-align:right;
      font-size:18px;
      transition:.15s ease;
    }
    .choice:hover{
      border-color:#93c5fd;
      background:#f8fbff;
      transform:translateY(-1px);
    }
    .choice .mark{
      width:28px;
      height:28px;
      border-radius:50%;
      border:2px solid #cbd5e1;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
      font-weight:900;
      margin-top:1px;
    }
    .choice.selected{
      border-color:var(--primary);
      background:#eff6ff;
    }
    .choice.correct{
      border-color:#86efac;
      background:#f0fdf4;
    }
    .choice.correct .mark{
      border-color:var(--ok);
      color:var(--ok);
    }
    .choice.wrong{
      border-color:#fecaca;
      background:#fef2f2;
    }
    .choice.wrong .mark{
      border-color:var(--bad);
      color:var(--bad);
    }
    .feedback{
      margin-top:16px;
      padding:13px 15px;
      border-radius:16px;
      display:none;
      font-weight:700;
    }
    .feedback.ok{
      display:block;
      background:#ecfdf5;
      color:#166534;
      border:1px solid #bbf7d0;
    }
    .feedback.bad{
      display:block;
      background:#fff7ed;
      color:#9a3412;
      border:1px solid #fed7aa;
    }
    .actions{
      display:flex;
      gap:12px;
      justify-content:space-between;
      flex-wrap:wrap;
      margin-top:18px;
    }
    button{
      border:0;
      border-radius:14px;
      padding:12px 18px;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
      transition:.15s ease;
    }
    .primary{
      background:var(--primary);
      color:#fff;
    }
    .primary:hover{background:var(--primary-dark)}
    .secondary{
      background:#f1f5f9;
      color:#334155;
      border:1px solid #e2e8f0;
    }
    .secondary:hover{background:#e2e8f0}
    .danger{
      background:#fff1f2;
      color:#be123c;
      border:1px solid #fecdd3;
    }
    .result{
      display:none;
      text-align:center;
      padding:22px;
    }
    .result h2{
      margin:0 0 10px;
      font-size:30px;
    }
    .big-score{
      font-size:56px;
      font-weight:1000;
      color:var(--primary);
      margin:12px 0;
      line-height:1.1;
    }
    .grade{
      display:inline-block;
      padding:10px 16px;
      border-radius:999px;
      font-weight:900;
      margin-bottom:14px;
    }
    .excellent{background:#ecfdf5;color:#166534;border:1px solid #bbf7d0}
    .good{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
    .needs{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}
    .review{
      margin-top:18px;
      text-align:right;
      display:grid;
      gap:10px;
    }
    .review-item{
      border:1px solid var(--border);
      border-radius:15px;
      padding:12px;
      background:#fff;
    }
    .review-item strong{color:var(--ink)}
    .footer-note{
      color:var(--muted);
      font-size:13px;
      text-align:center;
      margin-top:18px;
    }
    @media(max-width:640px){
      .meta{grid-template-columns:1fr}
      .q-text{font-size:19px}
      header,.panel{border-radius:20px}
      .actions button{flex:1}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>اختبار الفرق بين التاء المربوطة والهاء</h1>
      <p class="subtitle">اختر الإجابة الصحيحة في نهاية الكلمة، ثم انتقل بين الأسئلة. في النهاية ستظهر النتيجة مباشرة مع مراجعة الإجابات.</p>
      <div class="meta">
        <div class="field">
          <label for="studentName">الاسم</label>
          <input id="studentName" placeholder="اكتب اسمك هنا" />
        </div>
        <div class="field">
          <label for="quizDate">التاريخ</label>
          <input id="quizDate" />
        </div>
      </div>
    </header>

    <section class="panel" id="quizPanel">
      <div class="topbar">
        <div class="progress-wrap">
          <div class="progress-label">
            <span id="progressText">السؤال 1 من 10</span>
            <span id="percentText">0%</span>
          </div>
          <div class="progress"><div class="bar" id="bar"></div></div>
        </div>
        <div class="score-pill" id="liveScore">الدرجة الحالية: 0 / 10</div>
      </div>

      <div class="question-card">
        <div class="q-num" id="qNum"></div>
        <p class="q-text" id="qText"></p>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback"></div>
      </div>

      <div class="actions">
        <button class="secondary" id="prevBtn">السابق</button>
        <div>
          <button class="danger" id="resetBtn">إعادة الاختبار</button>
          <button class="primary" id="nextBtn">التالي</button>
        </div>
      </div>
    </section>

    <section class="panel result" id="resultPanel">
      <h2>نتيجة الاختبار</h2>
      <p id="resultName"></p>
      <div class="big-score" id="finalScore"></div>
      <div class="grade" id="grade"></div>
      <p id="resultMessage"></p>
      <div class="actions" style="justify-content:center">
        <button class="secondary" onclick="window.print()">طباعة النتيجة</button>
        <button class="primary" id="tryAgainBtn">إعادة المحاولة</button>
      </div>
      <div class="review" id="review"></div>
    </section>

    <p class="footer-note">صفحة اختبار تفاعلي جاهزة للنشر عبر GitHub Pages.</p>
  </main>

  <script>
    const questions = [
      {
        q: "اختر النهاية الصحيحة: تم إعداد خطـ... استراتيجية شاملة.",
        choices: ["خطة", "خطه", "خطاة"],
        answer: 0,
        explain: "الصحيح: خطة؛ لأنها اسم مؤنث تنتهي بتاء مربوطة."
      },
      {
        q: "اختر الكلمة الصحيحة في السياق: ألقى المُحاضر ... ثرية.",
        choices: ["كلمه", "كلمة", "كلمت"],
        answer: 1,
        explain: "الصحيح: كلمة؛ لأنها اسم مؤنث تنتهي بتاء مربوطة."
      },
      {
        q: "صحّح الكلمة: الدراسه",
        choices: ["الدراسة", "الدراسه", "الدراست"],
        answer: 0,
        explain: "الصحيح: الدراسة؛ لأن الكلمة تنتهي بتاء مربوطة."
      },
      {
        q: "ما التصحيح الصحيح لكلمة: اللغه؟",
        choices: ["اللغه", "اللغة", "اللغت"],
        answer: 1,
        explain: "الصحيح: اللغة؛ لأنها اسم مؤنث ينتهي بتاء مربوطة."
      },
      {
        q: "اختر التصنيف الصحيح لكلمة: انتباهه",
        choices: ["تنتهي بتاء مربوطة", "تنتهي بهاء", "تنتهي بألف مقصورة"],
        answer: 1,
        explain: "الصحيح: تنتهي بهاء؛ لأن الهاء ضمير في كلمة انتباهه."
      },
      {
        q: "اختر التصنيف الصحيح لكلمة: معرفة",
        choices: ["تنتهي بتاء مربوطة", "تنتهي بهاء", "تنتهي بهمزة"],
        answer: 0,
        explain: "الصحيح: تنتهي بتاء مربوطة؛ ويمكن نطقها تاء عند الوصل."
      },
      {
        q: "أكمل: تعتمد الإدارة الناجحة على وضوح الرؤيـ...",
        choices: ["ة", "ه", "ت"],
        answer: 0,
        explain: "الصحيح: الرؤية؛ لأنها اسم مؤنث ينتهي بتاء مربوطة."
      },
      {
        q: "أكمل: تحتاج المدرسـ... إلى تطوير مستمر.",
        choices: ["ه", "ة", "ت"],
        answer: 1,
        explain: "الصحيح: المدرسة؛ لأنها اسم مؤنث يدل على مكان التعليم."
      },
      {
        q: "أي كلمة تنتهي بهاء لا بتاء مربوطة؟",
        choices: ["حكمة", "بيئة", "مجاله"],
        answer: 2,
        explain: "الصحيح: مجاله؛ لأن الهاء ضمير يعود على شخص أو شيء."
      },
      {
        q: "أي جملة تحتوي على كلمة صحيحة بتاء مربوطة؟",
        choices: [
          "تتميز اللغه العربية بثراء مفرداتها.",
          "تساهم الخبره العملية في تطوير المهارات.",
          "تحتاج القيادة الناجحة إلى رؤية واضحة."
        ],
        answer: 2,
        explain: "الجملة الثالثة صحيحة؛ وفيها كلمات بتاء مربوطة مثل: القيادة، الناجحة، رؤية، واضحة."
      }
    ];

    let current = 0;
    let answers = Array(questions.length).fill(null);
    let locked = Array(questions.length).fill(false);

    const qNum = document.getElementById("qNum");
    const qText = document.getElementById("qText");
    const choicesEl = document.getElementById("choices");
    const feedback = document.getElementById("feedback");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const resetBtn = document.getElementById("resetBtn");
    const bar = document.getElementById("bar");
    const progressText = document.getElementById("progressText");
    const percentText = document.getElementById("percentText");
    const liveScore = document.getElementById("liveScore");
    const quizPanel = document.getElementById("quizPanel");
    const resultPanel = document.getElementById("resultPanel");
    const finalScore = document.getElementById("finalScore");
    const grade = document.getElementById("grade");
    const resultMessage = document.getElementById("resultMessage");
    const resultName = document.getElementById("resultName");
    const review = document.getElementById("review");
    const tryAgainBtn = document.getElementById("tryAgainBtn");
    const quizDate = document.getElementById("quizDate");

    quizDate.value = new Date().toLocaleDateString("ar-SA");

    function score(){
      return answers.reduce((sum, ans, i) => sum + (ans === questions[i].answer ? 1 : 0), 0);
    }

    function render(){
      const item = questions[current];
      qNum.textContent = `السؤال ${current + 1}`;
      qText.textContent = item.q;
      choicesEl.innerHTML = "";
      feedback.className = "feedback";
      feedback.textContent = "";

      item.choices.forEach((choice, idx) => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.innerHTML = `<span class="mark">${answers[current] === idx ? "•" : ""}</span><span>${choice}</span>`;
        if (answers[current] !== null) {
          if (idx === item.answer) btn.classList.add("correct");
          if (idx === answers[current] && idx !== item.answer) btn.classList.add("wrong");
        }
        btn.onclick = () => selectAnswer(idx);
        choicesEl.appendChild(btn);
      });

      if (answers[current] !== null) {
        const isOk = answers[current] === item.answer;
        feedback.className = "feedback " + (isOk ? "ok" : "bad");
        feedback.textContent = (isOk ? "إجابة صحيحة. " : "إجابة غير صحيحة. ") + item.explain;
      }

      prevBtn.disabled = current === 0;
      nextBtn.textContent = current === questions.length - 1 ? "عرض النتيجة" : "التالي";
      const answered = answers.filter(a => a !== null).length;
      const pct = Math.round((answered / questions.length) * 100);
      bar.style.width = pct + "%";
      progressText.textContent = `السؤال ${current + 1} من ${questions.length}`;
      percentText.textContent = pct + "%";
      liveScore.textContent = `الدرجة الحالية: ${score()} / ${questions.length}`;
    }

    function selectAnswer(idx){
      answers[current] = idx;
      render();
    }

    function showResult(){
      const s = score();
      const pct = Math.round((s / questions.length) * 100);
      quizPanel.style.display = "none";
      resultPanel.style.display = "block";
      finalScore.textContent = `${s} / ${questions.length}`;
      const name = document.getElementById("studentName").value.trim();
      resultName.textContent = name ? `اسم الطالب: ${name}` : "";
      grade.className = "grade";
      if (pct >= 90) {
        grade.classList.add("excellent");
        grade.textContent = "ممتاز";
        resultMessage.textContent = "أداء رائع، لديك فهم قوي للفرق بين التاء المربوطة والهاء.";
      } else if (pct >= 70) {
        grade.classList.add("good");
        grade.textContent = "جيد جدًا";
        resultMessage.textContent = "نتيجة جيدة، راجع الأسئلة التي أخطأت فيها لتعزيز الفهم.";
      } else {
        grade.classList.add("needs");
        grade.textContent = "يحتاج إلى مراجعة";
        resultMessage.textContent = "راجع القاعدة، ثم أعد المحاولة لتحسين النتيجة.";
      }

      review.innerHTML = questions.map((q, i) => {
        const user = answers[i] === null ? "لم تتم الإجابة" : q.choices[answers[i]];
        const correct = q.choices[q.answer];
        const ok = answers[i] === q.answer;
        return `
          <div class="review-item">
            <strong>${i + 1}. ${q.q}</strong><br>
            إجابتك: <span style="color:${ok ? '#166534' : '#b91c1c'};font-weight:800">${user}</span><br>
            الإجابة الصحيحة: <span style="font-weight:800">${correct}</span><br>
            <small>${q.explain}</small>
          </div>
        `;
      }).join("");
      window.scrollTo({top:0, behavior:"smooth"});
    }

    nextBtn.onclick = () => {
      if (current === questions.length - 1) {
        showResult();
      } else {
        current++;
        render();
      }
    };
    prevBtn.onclick = () => {
      if (current > 0) {
        current--;
        render();
      }
    };
    resetBtn.onclick = resetQuiz;
    tryAgainBtn.onclick = resetQuiz;

    function resetQuiz(){
      current = 0;
      answers = Array(questions.length).fill(null);
      quizPanel.style.display = "block";
      resultPanel.style.display = "none";
      render();
      window.scrollTo({top:0, behavior:"smooth"});
    }

    render();
  </script>
</body>
</html>
